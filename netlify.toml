[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers (audit 2026-06-14) ──────────────────────────────────────
# geolocation=(self) keeps GPS clock-in working (matches the browser default;
# it does NOT disable geolocation). CSP deferred to a browser-tested pass.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Content Security Policy, enforced since 2026-10-27 after a clean
    # report-only week. Cloudflare Web Analytics is allowed explicitly. No 'unsafe-inline':
    # Cloudflare's JS Detections inline snippet is blocked on purpose (harmless;
    # no WAF rule uses js_detection.passed) (to roll back, rename the key to
    # "Content-Security-Policy-Report-Only").
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://app.worktracksmb.com https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
