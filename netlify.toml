[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers (audit 2026-06-14) ──────────────────────────────────────
# geolocation=(self) keeps GPS clock-in working (matches the browser default;
# it does NOT disable geolocation). CSP deferred to a browser-tested pass.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # CSP in REPORT-ONLY mode: browsers log violations to the console but block
    # nothing, so it cannot break the site. After a clean week with no reports,
    # rename the key to "Content-Security-Policy" to enforce it.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://app.worktracksmb.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
